name: Banking API CI/CD Audit-Grade

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Permet le lancement manuel depuis l'interface GitHub

jobs:
  # ── PHASE 1 : Scan de secrets (Bloquant — Finding SEC-01) ────────────────
  secret-scan:
    name: "🔑 Secret Detection (gitleaks)"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Nécessaire pour que gitleaks analyse tout l'historique
    - name: Run Gitleaks (Scan de secrets dans le code et l'historique Git)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # ── PHASE 2 : Tests de sécurité et unitaires ─────────────────────────────
  security-and-tests:
    name: "🧪 Security Scans & Unit Tests"
    runs-on: ubuntu-latest
    needs: secret-scan  # Ne s'exécute qu'après validation de l'absence de secrets

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    # ── SAST : Analyse statique de sécurité du code source ──────────────────
    - name: Run SAST Scan (Bandit)
      run: |
        bandit -r backend/app -x backend/app/tests -f json -o bandit-report.json || true
        bandit -r backend/app -x backend/app/tests --severity-level medium

    # ── SCA : Analyse de la composition logicielle (dépendances vulnérables) ─
    - name: Run SCA Scan (pip-audit — Finding PROC-01)
      run: |
        # Ignore CVEs with no fix available upstream (torch CVE-2025-3000, PYSEC-2025-217)
        pip-audit -r backend/requirements.txt \
          --ignore-vuln CVE-2025-3000 \
          --ignore-vuln PYSEC-2025-217 \
          --format=json --output=pip-audit-report.json || true
        pip-audit -r backend/requirements.txt \
          --ignore-vuln CVE-2025-3000 \
          --ignore-vuln PYSEC-2025-217

    # ── Tests Unitaires avec couverture (cible ≥ 80%) ────────────────────────
    - name: Run Unit Tests with Coverage
      env:
        SECRET_KEY: "CI_TEST_SECRET_KEY_NOT_FOR_PROD"
        LOG_SIGNING_KEY: "CI_TEST_LOG_SIGNING_KEY_32_CHARS_MIN"
        DATA_ENCRYPTION_KEY: "dGhpcy1pcy1hLWR1bW15LWtleS1mb3ItY2ktdGVzdHM=" # dummy base64 key
        RSA_PRIVATE_KEY: ${{ secrets.CI_RSA_PRIVATE_KEY }}
        RSA_PUBLIC_KEY: ${{ secrets.CI_RSA_PUBLIC_KEY }}
        ENV: "test"
        MONGO_URL: "mongodb://localhost:27017"
        DATABASE_NAME: "test_db"
        DEFAULT_ADMIN_EMAIL: "ci-admin@test.local"
        DEFAULT_ADMIN_PASSWORD: "CIAdmin_Test_2026!"
      run: |
        cd backend
        PYTHONPATH=app pytest --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=60 tests/

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: backend/htmlcov/

    - name: Upload Security Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
          pip-audit-report.json

  # ── PHASE 3 : Build Docker + Scan de vulnérabilités conteneur ────────────
  container-scan:
    name: "🐳 Docker Build & Trivy Container Scan"
    runs-on: ubuntu-latest
    needs: security-and-tests  # Ne s'exécute qu'après succès des tests

    steps:
    - uses: actions/checkout@v4

    # Fix PROC-01 (Audit Bancaire) : Construire l'image AVANT de la scanner
    - name: Build Docker Image
      run: |
        docker build -t banking-api-backend:latest ./backend

    - name: Run SCA Scan (Trivy Container Scan — Finding PROC-01)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'banking-api-backend:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Export Trivy SARIF Report
      if: always()
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'banking-api-backend:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy SARIF to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
