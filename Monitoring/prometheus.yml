# prometheus.yml — Monitoring (Finding ARCH-05 résolu)
# Tous les exporters référencés sont maintenant déployés dans docker-compose.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # ── API Backend FastAPI ──────────────────────────────────────────
  - job_name: 'fastapi-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']

  # ── MongoDB (via mongodb-exporter — ajouté Finding ARCH-05) ─────
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']

  # ── Conteneurs Docker (via cAdvisor — ajouté Finding ARCH-05) ───
  - job_name: 'docker-containers'
    static_configs:
      - targets: ['cadvisor:8080']

  # ── AlertManager lui-même ────────────────────────────────────────
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
